name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          CAJAL_CONFIG_KEY: CI_test_key!Q7xM2nV9pL4tR8kH3dZ1w
        run: npm test

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: false  # requires a live server+DB; run locally with npm run test:e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx --yes playwright@1.52.0 install --with-deps chromium

      - name: Run browser smoke tests
        run: npx --yes playwright@1.52.0 test -c tests/e2e/playwright.config.js
