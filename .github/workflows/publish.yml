name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nniell90/cajal

jobs:
  build-windows-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: pwsh
        run: Install-Module -Name ps2exe -Force -Scope CurrentUser

      - name: Compile agent to .exe
        shell: pwsh
        run: |
          Invoke-PS2EXE `
            -InputFile  agent/cajal-windows-agent.ps1 `
            -OutputFile agent/cajal-windows-agent.exe `
            -NoConsole:$false `
            -Title 'Cajal ICBM Windows Agent' `
            -Version '${{ github.ref_name }}' `
            -Description 'Cajal ICBM collector agent for Windows' `
            -Company 'Cajal ICBM' `
            -Product 'Cajal Windows Agent'

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-exe
          path: agent/cajal-windows-agent.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build-windows-agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows agent .exe
        uses: actions/download-artifact@v4
        with:
          name: windows-agent-exe
          path: agent/

      - name: Verify .exe exists
        run: ls -la agent/cajal-windows-agent.exe

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nniell90
          password: ${{ secrets.PERSONAL_GHCR_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Upload .exe to GitHub release
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_GHCR_TOKEN }}
        run: gh release upload ${{ github.ref_name }} agent/cajal-windows-agent.exe --clobber
