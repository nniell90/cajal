services:
  postgres:
    image: postgres:16-alpine
    container_name: cajal-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${CAJAL_DB_NAME:-cajal}
      POSTGRES_USER: ${CAJAL_DB_USER:-cajal}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - cajal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  cajal:
    image: ghcr.io/nniell90/cajal:latest
    container_name: cajal-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:${PORT:-4000}:${PORT:-4000}"
      - "0.0.0.0:${CAJAL_SYSLOG_TCP_PORT:-5514}:${CAJAL_SYSLOG_TCP_PORT:-5514}/tcp"
      - "0.0.0.0:${CAJAL_SYSLOG_UDP_PORT:-5514}:${CAJAL_SYSLOG_UDP_PORT:-5514}/udp"
      - "0.0.0.0:${CAJAL_NETFLOW_PORT:-2055}:${CAJAL_NETFLOW_PORT:-2055}/udp"
    env_file: .env
    secrets:
      - db_password
    environment:
      PORT: ${PORT:-4000}
      CAJAL_STORAGE_BACKEND: postgres
      CAJAL_DATABASE_URL: postgresql://${CAJAL_DB_USER:-cajal}:${CAJAL_DB_PASSWORD:-cajal}@cajal-postgres:5432/${CAJAL_DB_NAME:-cajal}
      CAJAL_DATABASE_SSL: disable
      CAJAL_WATCHTOWER_URL: http://cajal-watchtower:8080
      CAJAL_WATCHTOWER_TOKEN: ${CAJAL_WATCHTOWER_TOKEN:-}
      CAJAL_DB_PASSWORD_FILE: /run/secrets/db_password
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-4000}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: cajal-socket-proxy
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTAINERS: 1
      IMAGES: 1
      AUTH: 1
      POST: 1
      DELETE: 1
      NETWORKS: 1
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: cajal-watchtower
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - socket-proxy
    environment:
      DOCKER_HOST: tcp://cajal-socket-proxy:2375
      WATCHTOWER_HTTP_API_TOKEN: ${CAJAL_WATCHTOWER_TOKEN:-}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
    command: --http-api-update --interval 86400
    restart: unless-stopped

secrets:
  db_password:
    file: ${CAJAL_DB_PASSWORD_FILE:-.db_password}

volumes:
  cajal-postgres-data:
